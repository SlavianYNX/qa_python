name: Python CI with Debug

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  setup-and-diagnose:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Debug - Show project structure
      run: |
        echo "=== Project Structure ==="
        find . -type f -name "*.py" | sort
        echo ""
        echo "=== Directory Contents ==="
        ls -la
        echo ""
        echo "=== Python Version ==="
        python --version
        echo ""
        echo "=== Pip Version ==="
        pip --version

    - name: Install pytest
      run: |
        python -m pip install --upgrade pip
        pip install pytest

    - name: Find and run tests
      run: |
        echo "=== Looking for test files ==="
        # Ищем файлы с тестами
        find . -name "*test*.py" -o -name "*_test.py" | grep -v __pycache__ || echo "No test files found with common patterns"
        
        echo ""
        echo "=== Trying to discover tests with pytest ==="
        # Пробуем найти тесты
        python -m pytest --collect-only > test_discovery.txt 2>&1 || true
        echo "Test discovery output:"
        cat test_discovery.txt || echo "No tests discovered"
        
        echo ""
        echo "=== Attempting to run tests ==="
        # Запускаем тесты с подробным выводом
        python -m pytest . -v --tb=short || echo "Test run completed with exit code: $?"

    - name: Check Python syntax
      run: |
        echo "=== Checking Python syntax ==="
        # Проверяем синтаксис всех Python файлов
        for file in $(find . -name "*.py"); do
          echo "Checking $file"
          python -m py_compile "$file" || echo "Syntax error in $file"
        done
        echo "Syntax check completed"
