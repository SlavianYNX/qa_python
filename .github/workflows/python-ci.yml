name: Basic Python Check

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  diagnose:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Show what's in the repository
      run: |
        echo "=== Complete file list ==="
        find . -type f | sort
        echo ""
        echo "=== Python files ==="
        find . -name "*.py" | sort
        echo ""
        echo "=== Any test files? ==="
        find . -name "*test*" -o -name "*Test*" | sort || echo "No test files found"
