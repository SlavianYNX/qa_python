name: Python CI with Debug

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Debug project structure
      run: |
        echo "=== Project Structure ==="
        find . -name "*.py" | sort
        echo ""
        echo "=== Test files found ==="
        find . -name "*test*.py" -o -name "*_test.py" | sort || echo "No test files found with standard patterns"
        echo ""
        echo "=== All files ==="
        find . -type f | grep -v "__pycache__" | head -20

    - name: Try to discover tests
      run: |
        echo "=== Trying to discover tests ==="
        
        # Способ 1: unittest discover
        echo "1. unittest discover:"
        python -m unittest discover --help | head -5
        python -m unittest discover -v 2>&1 | head -10 || echo "unittest discover failed"
        
        echo ""
        # Способ 2: pytest
        pip install pytest
        echo "2. pytest discovery:"
        python -m pytest --collect-only 2>&1 | head -10 || echo "pytest discovery failed"
        
        echo ""
        # Способ 3: попробовать запустить все python файлы
        echo "3. Trying to run Python files:"
        for py_file in $(find . -name "*.py" | head -5); do
          echo "Testing: $py_file"
          python "$py_file" --help 2>&1 | head -3 || echo "Not a runnable script"
        done

    - name: Run tests if found
      run: |
        # Пробуем запустить тесты если они есть
        if find . -name "*test*.py" -o -name "*_test.py" | grep -q .; then
          echo "=== Running discovered tests ==="
          python -m unittest discover -v
        else
          echo "=== No test files found ==="
          echo "Creating simple test to verify setup..."
          python -c "
import unittest
class TestBasicSetup(unittest.TestCase):
    def test_python_version(self):
        import sys
        self.assertTrue(sys.version_info >= (3, 8))
        print('Python version check passed')
if __name__ == '__main__':
    unittest.main()
          "
        fi
