название: Демонстрация действий GitHub
run-name: ${{ github.actor }} тестирует действия GitHub 🚀
на: [нажать]
вакансии:
  Explore-GitHub-Actions:
    запускается на: ubuntu-latest
    шаги:
      - выполнить: echo "🎉 Задание было автоматически запущено событием ${{ github.event_name }}."
      - запустить: echo "🐧 Это задание теперь выполняется на сервере ${{ runner.os }}, размещенном на GitHub!"
      - выполнить: echo "🔎 Имя вашей ветки — ${{ github.ref }}, а ваш репозиторий — ${{ github.repository }}."
      - имя: Проверить код репозитория
        использование: actions/checkout@v5
      - выполнить: echo "💡 Репозиторий ${{ github.repository }} был клонирован в средство выполнения."
      - запустить: echo "🖥️ Теперь рабочий процесс готов к тестированию вашего кода на устройстве запуска."
      - имя: Список файлов в репозитории
        выполнить: |
          ls ${{ github.workspace }}
      - выполнить: echo "🍏 Статус этой работы: ${{ job.status }}."
